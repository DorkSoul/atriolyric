name: Build and publish container

# master publishes :edge and :sha-<commit>; a published GitHub release
# (tag vX.Y.Z) publishes :X.Y.Z, :X.Y and :latest, with the release's APK
# inside. Tests are not run here: they run on pull requests into master
# (tests.yml) and locally before a release (docs/releasing.md).
on:
  push:
    branches:
      - master
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

# Actions are pinned by commit so a moved tag cannot change what runs here.
jobs:
  build-and-push:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The signed APK is attached to the GitHub release; the image carries it
      # so the server can offer the app and its updates. Master builds and a
      # release without the asset get an image without the app.
      - name: Fetch the Android app from the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern atriolyric.apk --dir android-release; then
            printf '{"version": "%s"}\n' "${TAG#v}" > android-release/atriolyric.apk.json
            echo "Android app ${TAG#v}: $(stat -c %s android-release/atriolyric.apk) bytes"
          else
            echo "::warning title=No Android app::Release $TAG has no atriolyric.apk asset, so this image offers no Android app."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=edge,branch=master
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      # Built and loaded locally first, so the scan below sees exactly the
      # image that is then pushed (the push reuses this build's cache).
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: atriolyric:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # HIGH or CRITICAL findings that have a fix fail the run before anything
      # is pushed; ones with no fix released yet are ignored. Trivy comes from
      # its release tarball, checked against the sha256 in the release's
      # trivy_0.76.1_checksums.txt.
      - name: Scan image for vulnerabilities
        env:
          TRIVY_VERSION: 0.76.1
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          set -eu
          curl -fsSLo "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" image --no-progress --scanners vuln --exit-code 1 \
            --severity HIGH,CRITICAL --ignore-unfixed atriolyric:scan

      - name: Push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
