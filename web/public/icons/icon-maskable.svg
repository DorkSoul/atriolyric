<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <!-- Source of icon-maskable-192.png and icon-maskable-512.png:
         rsvg-convert -w 512 -h 512 icon-maskable.svg -o icon-maskable-512.png
       The launcher cuts its own shape out of this, so the background fills
       the whole square (no rounded tile of its own) and the mark is scaled to
       stay inside the central safe circle (radius 40%). -->
  <defs>
    <linearGradient id="atrium-sky" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#563bb5"/><stop offset="1" stop-color="#261468"/></linearGradient><radialGradient id="atrium-glow" cx="20" cy="8" r="46" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a98cff" stop-opacity="0.2"/><stop offset="1" stop-color="#a98cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="atrium-light" x1="32" y1="10" x2="32" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#70ead4"/>
      <stop offset="1" stop-color="#5b8def"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#atrium-sky)"/><rect width="64" height="64" fill="url(#atrium-glow)"/>
  <g transform="translate(32 32) scale(0.9) translate(-32 -31)">
    <path d="M12 50V32c0-11 9-20 20-20s20 9 20 20v18h-7V32c0-7.2-5.8-13-13-13s-13 5.8-13 13v18h-7Z" fill="url(#atrium-light)" opacity=".7"/>
    <path d="M24 34v10a3.8 3.8 0 1 1-2.8-3.7V29h8v3.5H24Z" fill="#ffffff"/>
    <path d="M34 35h10M34 40h7" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
