<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Starts the sign-in check while the app downloads (see public/boot.js). -->
    <script src="/boot.js" async></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d1017" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)" />
    <!-- viewport-fit=cover: the CSS already pads for the safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Atriolyric</title>
    <!-- The page's colour before the stylesheet and the app arrive (the same
         --bg values as styles/base.css), so a slow load shows an empty page of
         the right colour rather than a white flash. -->
    <style>
      html { background: #0d1017; }
      html[data-theme='light'] { background: #f4f6fa; }
      .boot-shell { min-height: 100vh; min-height: 100dvh; }
    </style>
  </head>
  <body>
    <!-- Replaced by the app on its first render. -->
    <div id="root"><div class="boot-shell" aria-hidden="true"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
