[project]
name = "atriolyric-server"
# Not the app's version, which has one source: web/package.json, carried into
# the web build's version.json and read by app/version.py (GET /api/version,
# the OpenAPI document, the User-Agent). This package is never published, so it
# stays at 0.0.0 rather than drift out of step with the real one.
version = "0.0.0"
description = "Self-hosted music/video media server API"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    # Upper bounds sit at the next breaking release.
    # (sqlalchemy 2.2 and fastapi 1.0 have not been tested here.)
    "fastapi>=0.115,<1.0",
    # Not uvicorn[standard]: that also pulls watchfiles, pyyaml and python-dotenv,
    # none of which production uses. The parts actually used are listed instead.
    "uvicorn>=0.30,<1.0",
    "uvloop>=0.22; sys_platform != 'win32'",
    "httptools>=0.8",
    # 17.4 and later: recv() caps fragmented messages, so a client cannot exhaust memory.
    "websockets>=17.4",
    "sqlalchemy>=2.1,<2.2",
    "mutagen>=1.47,<2.0",
    "bcrypt>=4.1,<6.0",
    "pydantic-settings>=2.4,<3.0",
    "httpx>=0.27,<1.0",
    "cryptography>=44.0,<51.0",
    # Local audio analysis (app.audio_features, app.audio_similarity): FFTs
    # and the in-memory similarity index. BSD, wheels for x86_64 and aarch64.
    "numpy>=2.1,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    # starlette.testclient (TestClient) runs on httpx2; with only httpx it still
    # works but warns that httpx is deprecated there. The app itself uses httpx.
    "httpx2>=2.16",
    "ruff",
    "pyright",
    # Keeps `uvicorn --reload` on its fast reloader in development.
    "watchfiles",
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "network: hits a real third-party API (MusicBrainz, lrclib, ListenBrainz) - needs internet, not mocked",
    "real_background_jobs: keep the lifespan's backfill threads and scheduler task (tests/conftest.py skips them otherwise)",
    "deferred_fetches: info/lyrics/catalog requests answer from stored data and queue provider look-ups (tests/conftest.py fetches inline otherwise)",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# Measured line coverage is 95%; raise this only when coverage is actually raised.
fail_under = 94

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "BLE", "UP", "S", "I"]
ignore = [
    # The code base is not formatted to a fixed width.
    "E501",
    # `assert x is not None` is how app code tells pyright about an invariant the
    # types cannot express (each says why); none guards user input or security.
    "S101",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends/Query/etc. in argument defaults are the framework's idiom, not a bug.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path",
    "fastapi.Header", "fastapi.Cookie", "fastapi.Form", "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S105", "S106",  # fixture passwords and tokens
    "S108",  # hard-coded temp paths in fixtures
    "S603", "S607",  # subprocess calls in tests
    "BLE001",  # tests may catch Exception to assert on it
    "S107",  # fixture helpers default a password argument
    # Style noise in test code, not bug patterns: one-line `a; b` setup, `l` in
    # comprehensions over log lines, assigned lambdas, zips of equal-length lists,
    # and imports placed after a sys.path/monkeypatch setup.
    "E402", "E702", "E731", "E741", "B905",
]

[tool.pyright]
include = ["app"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
